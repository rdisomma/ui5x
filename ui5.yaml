specVersion: "4.0"
type: library
framework:
  name: OpenUI5
  version: "1.151.0"
  libraries:
    - name: sap.ui.core
    - name: sap.m
    - name: sap.ui.table
    - name: themelib_sap_horizon
      development: true
    - name: themelib_sap_fiori_3
      development: true
builder:
  resources:
    excludes:
      - "/test-resources/**"
  customTasks:
    - name: ui5-tooling-transpile-task
      afterTask: replaceVersion
server:
  customMiddleware:
    - name: ui5-tooling-transpile-middleware
      afterMiddleware: compression
      configuration:
        # The middleware regenerates the .gen.d.ts files while serving, and
        # without this it writes less JSDoc than `npm run interfaces` does.
        # The two would then keep overwriting each other's output.
        generateTsInterfacesJsDoc: verbose
metadata:
  name: ui5x
  copyright: |-
    Copyright (c) ${currentYear} Raffaele Di Somma.
