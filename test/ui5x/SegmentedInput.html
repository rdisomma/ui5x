<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X SegmentedInput Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseGrid {
            width: 45rem;
        }

        .showcaseRow {
            width: 100%;
        }

        .showcaseRow + .showcaseRow {
            margin-top: 3rem;
        }

        .showcaseLabel {
            width: 5.5rem;
            margin-right: 0.5rem;

            flex: 0 0 auto;
        }

        .showcaseComplete .ui5xSegmentedInputValueStateText {
            visibility: visible;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/input/SegmentedInput",
            "ui5x/test/demo/DemoToolbar",
            "sap/base/Log",
            "sap/m/HBox",
            "sap/m/Label",
            "sap/m/VBox"
        ], function (
            SegmentedInput,
            DemoToolbar,
            Log,
            HBox,
            Label,
            VBox
        ) {
            "use strict";

            function createEntry(configuration) {
                const control = new SegmentedInput({
                    ...configuration.settings,
                    valueStateText: configuration.initialText,

                    liveChange: function (event) {
                        Log.info(
                            `${configuration.label}: ${event.getParameter("value")}`
                        );
                    },

                    complete: function () {
                        this.setValueState(configuration.completeState);
                        this.setValueStateText(configuration.completeText);
                        this.addStyleClass("showcaseComplete");
                    }
                });

                return {
                    ...configuration,
                    control
                };
            }

            /*
             * The toolbar drives every entry at once, so the shared settings
             * are the single source of truth for its initial values. Each
             * entry keeps only what the toolbar does not change.
             */
            const sharedSettings = {
                inputType: "Alphanumeric",
                size: "Medium",
                showSeparators: true,
                separatorInterval: 4,
                showClearIcon: true
            };

            const entries = [
                createEntry({
                    label: "One-time code",
                    initialText: "Enter the six-digit code",
                    completeState: "None",
                    completeText: "Code verified",
                    settings: {
                        ...sharedSettings,
                        digits: 6
                    }
                }),
                createEntry({
                    label: "License key",
                    initialText: "Enter the product key",
                    completeState: "Success",
                    completeText: "License key accepted",
                    settings: {
                        ...sharedSettings,
                        digits: 8
                    }
                }),
                createEntry({
                    label: "Fiscal code",
                    initialText: "Enter a valid fiscal code",
                    completeState: "Error",
                    completeText: "Invalid fiscal code",
                    settings: {
                        ...sharedSettings,
                        digits: 16
                    }
                })
            ];

            const reference = entries[0].control;

            function createRow(entry) {
                return new HBox({
                    width: "100%",
                    alignItems: "Center",
                    items: [
                        entry.control
                    ]
                }).addStyleClass("showcaseRow");
            }

            const surface = new VBox({
                width: "100%",
                items: entries.map(createRow)
            }).addStyleClass("showcaseGrid");

            surface.placeAt("content");

            function forEachControl(callback) {
                entries.forEach(function (entry) {
                    callback(entry.control, entry);
                });
            }

            function resetEntry(control, entry) {
                control.clear();
                control.setValueState("None");
                control.setValueStateText(entry.initialText);
                control.removeStyleClass("showcaseComplete");
            }

            DemoToolbar.place("SegmentedInput", [
                DemoToolbar.label("Size"),
                DemoToolbar.choice(
                    ["Small", "Medium", "Large"],
                    reference.getSize(),
                    function (key) {
                        forEachControl(function (control) {
                            control.setSize(key);
                        });
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Input type"),
                DemoToolbar.choice(
                    ["Numeric", "Alphanumeric"],
                    reference.getInputType(),
                    function (key) {
                        forEachControl(function (control) {
                            control.setInputType(key);
                        });
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.toggle(
                    "Separators",
                    reference.getShowSeparators(),
                    function (pressed) {
                        forEachControl(function (control) {
                            control.setShowSeparators(pressed);
                        });
                    }
                ),

                DemoToolbar.label("Interval"),
                DemoToolbar.number(
                    reference.getSeparatorInterval(),
                    1,
                    8,
                    function (value) {
                        forEachControl(function (control) {
                            control.setSeparatorInterval(value);
                        });
                    }
                ),

                DemoToolbar.toggle(
                    "Clear icon",
                    reference.getShowClearIcon(),
                    function (pressed) {
                        forEachControl(function (control) {
                            control.setShowClearIcon(pressed);
                        });
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Value state"),
                DemoToolbar.choice(
                    ["None", "Success", "Warning", "Error"],
                    reference.getValueState(),
                    function (key) {
                        forEachControl(function (control, entry) {
                            control.setValueState(key);
                            control.setValueStateText(
                                key === "None" ? entry.initialText : entry.completeText
                            );
                            control.addStyleClass("showcaseComplete");
                        });
                    }
                ),

                DemoToolbar.action("Clear all", function () {
                    forEachControl(resetEntry);
                })
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
