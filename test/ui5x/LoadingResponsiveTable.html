<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X LoadingResponsiveTable Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseTable {
            width: 64rem;

            box-sizing: border-box;

            background: var(--sapGroup_ContentBackground);

            border: 1px solid var(--sapGroup_ContentBorderColor);
            border-radius: 0.75rem;

            box-shadow: var(--sapContent_Shadow0);

            overflow: hidden;
        }

        /*
         * Keep both the source table and the internally generated
         * skeleton table geometrically identical.
         */

        /*
         * The application pins the height of its own rows. The skeleton rows
         * follow through skeletonRowHeight, not through this rule.
         */
        .appTable .sapMListTblRow,
        .appTable .sapMListTblCell {
            height: 3.5rem;

            box-sizing: border-box;
        }

        .showcaseTable .sapMListTblHeader {
            height: 2.75rem;
        }

        .showcaseTable .sapMListTblHeaderCell {
            height: 2.75rem;

            box-sizing: border-box;

            vertical-align: middle;
        }


        /*
         * Softer separators make the table feel less spreadsheet-like.
         */

        .showcaseTable .sapMListTblCell {
            border-bottom-color:
                color-mix(
                    in srgb,
                    var(--sapList_BorderColor) 55%,
                    transparent
                );
        }

        /*
         * Customer / company hierarchy.
         */

        .rowPrimary {
            font-weight: 600;
            color: var(--sapTextColor);
        }

        .rowSecondary {
            margin-top: 0.125rem;

            font-size: 0.75rem;
            color: var(--sapContent_LabelColor);
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/library",
            "ui5x/loading/LoadingResponsiveTable",
            "ui5x/test/demo/DemoToolbar",
            "sap/ui/model/json/JSONModel",
            "sap/m/Button",
            "sap/m/OverflowToolbar",
            "sap/m/SearchField",
            "sap/m/Table",
            "sap/m/Title",
            "sap/m/ToolbarSpacer",
            "sap/m/Column",
            "sap/m/ColumnListItem",
            "sap/m/Text",
            "sap/m/ObjectStatus",
            "sap/m/ObjectNumber",
            "sap/m/Avatar",
            "sap/m/HBox",
            "sap/m/VBox"
        ], function (
            library,
            LoadingResponsiveTable,
            DemoToolbar,
            JSONModel,
            Button,
            OverflowToolbar,
            SearchField,
            Table,
            Title,
            ToolbarSpacer,
            Column,
            ColumnListItem,
            Text,
            ObjectStatus,
            ObjectNumber,
            Avatar,
            HBox,
            VBox
        ) {
            "use strict";

            const model = new JSONModel({
                rows: []
            });

            const sourceTable = new Table({
                width: "100%",
                fixedLayout: true,
                showSeparators: "Inner",

                headerToolbar: new OverflowToolbar({
                    content: [
                        new Title({ text: "Customers" }),
                        new ToolbarSpacer(),
                        new SearchField({ width: "14rem" }),
                        new Button({ icon: "sap-icon://sort" }),
                        new Button({ icon: "sap-icon://filter" })
                    ]
                }),


                columns: [
                    new Column({
                        header: new Text({
                            text: "Customer"
                        })
                    }),

                    new Column({
                        header: new Text({
                            text: "Company"
                        })
                    }),

                    new Column({
                        minScreenWidth: "Tablet",
                        demandPopin: true,
                        header: new Text({
                            text: "Status"
                        })
                    }),

                    new Column({
                        hAlign: "End",
                        minScreenWidth: "Tablet",
                        demandPopin: true,
                        header: new Text({
                            text: "Revenue"
                        })
                    }),

                    new Column({
                        minScreenWidth: "Desktop",
                        demandPopin: true,
                        header: new Text({
                            text: "Location"
                        })
                    })
                ]
            });

            sourceTable.addStyleClass("appTable");

            sourceTable.bindItems({
                path: "/rows",
                templateShareable: false,

                template: new ColumnListItem({
                    vAlign: "Middle",

                    cells: [
                        new HBox({
                            alignItems: "Center",
                            gap: "0.75rem",

                            items: [
                                new Avatar({
                                    initials: "{initials}",
                                    displaySize: "XS",
                                    backgroundColor: "{avatarColor}"
                                }),

                                new VBox({
                                    items: [
                                        new Text({
                                            text: "{name}",
                                            wrapping: false
                                        }).addStyleClass("rowPrimary"),

                                        new Text({
                                            text: "{email}",
                                            wrapping: false
                                        }).addStyleClass("rowSecondary")
                                    ]
                                })
                            ]
                        }),

                        new VBox({
                            items: [
                                new Text({
                                    text: "{company}",
                                    wrapping: false
                                }).addStyleClass("rowPrimary"),

                                new Text({
                                    text: "{industry}",
                                    wrapping: false
                                }).addStyleClass("rowSecondary")
                            ]
                        }),

                        new ObjectStatus({
                            text: "{status}",
                            state: "{statusState}"
                        }),

                        new ObjectNumber({
                            number: "{amount}",
                            unit: "EUR",
                            emphasized: false
                        }),

                        new VBox({
                            items: [
                                new Text({
                                    text: "{city}",
                                    wrapping: false
                                }).addStyleClass("rowPrimary"),

                                new Text({
                                    text: "{country}",
                                    wrapping: false
                                }).addStyleClass("rowSecondary")
                            ]
                        })
                    ]
                })
            });

            const loadingTable = new LoadingResponsiveTable({
                loading: true,

                skeletonRowsMode: "Fixed",
                skeletonRows: 5,
                maxSkeletonRows: 5,

                animated: true,
                dynamicSkeletonWidths: true,
                skeletonRowHeight: "3.5rem",

                table: sourceTable
            });

            loadingTable.setModel(model);

            const loadedRows = [
                {
                    initials: "MR",
                    avatarColor: "Accent1",

                    name: "Mario Rossi",
                    email: "mario.rossi@example.com",

                    company: "Acme S.p.A.",
                    industry: "Manufacturing",

                    status: "Active",
                    statusState: "Success",

                    amount: "125,000",

                    city: "Milan",
                    country: "Italy"
                },

                {
                    initials: "LB",
                    avatarColor: "Accent2",

                    name: "Laura Bianchi",
                    email: "laura.bianchi@example.com",

                    company: "Example S.r.l.",
                    industry: "Consulting",

                    status: "Pending",
                    statusState: "Warning",

                    amount: "87,500",

                    city: "Rome",
                    country: "Italy"
                },

                {
                    initials: "GV",
                    avatarColor: "Accent3",

                    name: "Giuseppe Verdi",
                    email: "giuseppe.verdi@example.com",

                    company: "Northwind",
                    industry: "Retail",

                    status: "Active",
                    statusState: "Success",

                    amount: "310,000",

                    city: "Turin",
                    country: "Italy"
                },

                {
                    initials: "AN",
                    avatarColor: "Accent4",

                    name: "Anna Neri",
                    email: "anna.neri@example.com",

                    company: "Contoso",
                    industry: "Technology",

                    status: "Inactive",
                    statusState: "Error",

                    amount: "42,000",

                    city: "Naples",
                    country: "Italy"
                },

                {
                    initials: "LG",
                    avatarColor: "Accent5",

                    name: "Luca Gialli",
                    email: "luca.gialli@example.com",

                    company: "Fabrikam",
                    industry: "Logistics",

                    status: "Active",
                    statusState: "Success",

                    amount: "198,000",

                    city: "Bologna",
                    country: "Italy"
                }
            ];

            const surface = new VBox({
                width: "64rem",
                items: [
                    loadingTable
                ]
            }).addStyleClass("showcaseTable");

            surface.placeAt("content");

            function setLoading(loading) {
                model.setProperty("/rows", loading ? [] : loadedRows);
                loadingTable.setLoading(loading);
            }

            setLoading(true);

            DemoToolbar.place("LoadingResponsiveTable", [
                DemoToolbar.toggle(
                    "Loading",
                    loadingTable.getLoading(),
                    setLoading
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Row height"),
                DemoToolbar.choice(
                    ["auto", "3.5rem", "5rem"],
                    loadingTable.getSkeletonRowHeight() || "auto",
                    function (key) {
                        loadingTable.setSkeletonRowHeight(
                            key === "auto" ? "" : key
                        );
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Rows mode"),
                DemoToolbar.choice(
                    ["Fixed", "Fill"],
                    loadingTable.getSkeletonRowsMode(),
                    function (key) {
                        loadingTable.setSkeletonRowsMode(key);
                    }
                ),

                DemoToolbar.label("Rows"),
                DemoToolbar.number(
                    loadingTable.getSkeletonRows(),
                    1,
                    20,
                    function (value) {
                        loadingTable.setSkeletonRows(value);
                    }
                ),

                DemoToolbar.label("Max rows"),
                DemoToolbar.number(
                    loadingTable.getMaxSkeletonRows(),
                    1,
                    20,
                    function (value) {
                        loadingTable.setMaxSkeletonRows(value);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.toggle(
                    "Dynamic widths",
                    loadingTable.getDynamicSkeletonWidths(),
                    function (pressed) {
                        loadingTable.setDynamicSkeletonWidths(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Animated",
                    loadingTable.getAnimated(),
                    function (pressed) {
                        loadingTable.setAnimated(pressed);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Width"),
                DemoToolbar.choice(
                    ["64rem", "80rem", "100%"],
                    surface.getWidth(),
                    function (key) {
                        surface.setWidth(key);
                    }
                )
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
