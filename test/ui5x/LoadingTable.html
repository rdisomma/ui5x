<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X LoadingTable Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseTable {
            width: 54rem;

            box-sizing: border-box;
            overflow: hidden;

            background: var(--sapGroup_ContentBackground);

            border: 1px solid var(--sapGroup_ContentBorderColor);
            border-radius: 0.75rem;
        }

        /*
         * Keep sap.ui.table's native Horizon cell separators.
         */

        .columnLabel {
            width: 100%;

            text-align: left;
        }

        .primaryText {
            font-weight: 600;
            color: var(--sapTextColor);
        }

        .secondaryText {
            margin-top: 0.125rem;

            font-size: 0.75rem;
            color: var(--sapContent_LabelColor);
        }

        .revenueNumber {
            font-variant-numeric: tabular-nums;
        }
    </style>

    <script id="sap-ui-bootstrap" src="/resources/sap-ui-core.js" data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true" data-sap-ui-compat-version="edge">
        </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/library",
            "ui5x/loading/LoadingTable",
            "ui5x/test/demo/DemoToolbar",
            "sap/ui/model/json/JSONModel",
            "sap/m/Button",
            "sap/m/OverflowToolbar",
            "sap/m/SearchField",
            "sap/m/Title",
            "sap/m/ToolbarSpacer",
            "sap/ui/table/Table",
            "sap/ui/table/Column",
            "sap/ui/table/RowAction",
            "sap/ui/table/RowActionItem",
            "sap/m/Text",
            "sap/m/ObjectStatus",
            "sap/m/ObjectNumber",
            "sap/m/MessageToast",
            "sap/m/VBox"
        ], function (
            library,
            LoadingTable,
            DemoToolbar,
            JSONModel,
            Button,
            OverflowToolbar,
            SearchField,
            Title,
            ToolbarSpacer,
            Table,
            Column,
            RowAction,
            RowActionItem,
            Text,
            ObjectStatus,
            ObjectNumber,
            MessageToast,
            VBox
        ) {
            "use strict";

            const model = new JSONModel({
                rows: []
            });

            /*
             * Row action
             */

            const rowActionTemplate = new RowAction({
                items: [
                    new RowActionItem({
                        icon: "sap-icon://navigation-right-arrow",
                        text: "Open customer",

                        press: function (event) {
                            const item = event.getSource();
                            const context =
                                item.getBindingContext();

                            if (!context) {
                                return;
                            }

                            const customer =
                                context.getProperty("name");

                            MessageToast.show(
                                `Open ${customer}`
                            );
                        }
                    })
                ]
            });

            /*
             * Source application table
             */

            const sourceTable = new Table({
                width: "100%",

                extension: [
                    new OverflowToolbar({
                        content: [
                            new Title({ text: "Customers" }),
                            new ToolbarSpacer(),
                            new SearchField({ width: "14rem" }),
                            new Button({ icon: "sap-icon://sort" }),
                            new Button({ icon: "sap-icon://filter" })
                        ]
                    })
                ],

                visibleRowCount: 5,
                visibleRowCountMode: "Fixed",

                rowHeight: 56,
                columnHeaderHeight: 48,

                selectionMode: "None",
                rowHeaderVisible: false,

                enableColumnReordering: false,

                /*
                 * Reserve one native row-action slot.
                 *
                 * LoadingTable mirrors rowActionCount on its internal
                 * skeleton table, preserving the table geometry while
                 * the real row actions are temporarily unavailable.
                 */
                rowActionCount: 1,
                rowActionTemplate: rowActionTemplate,

                columns: [
                    new Column({
                        width: "auto",
                        minWidth: 272,

                        label: new Text({
                            text: "Customer",
                            width: "100%",
                            textAlign: "Begin"
                        }).addStyleClass(
                            "columnLabel"
                        ),

                        template: new VBox({
                            justifyContent: "Center",

                            items: [
                                new Text({
                                    text: "{name}",
                                    wrapping: false
                                }).addStyleClass(
                                    "primaryText"
                                ),

                                new Text({
                                    text: "{email}",
                                    wrapping: false
                                }).addStyleClass(
                                    "secondaryText"
                                )
                            ]
                        })
                    }),

                    new Column({
                        width: "auto",
                        minWidth: 240,

                        label: new Text({
                            text: "Company",
                            width: "100%",
                            textAlign: "Begin"
                        }).addStyleClass(
                            "columnLabel"
                        ),

                        template: new VBox({
                            justifyContent: "Center",

                            items: [
                                new Text({
                                    text: "{company}",
                                    wrapping: false
                                }).addStyleClass(
                                    "primaryText"
                                ),

                                new Text({
                                    text: "{segment}",
                                    wrapping: false
                                }).addStyleClass(
                                    "secondaryText"
                                )
                            ]
                        })
                    }),

                    new Column({
                        width: "auto",
                        minWidth: 160,

                        label: new Text({
                            text: "Status",
                            width: "100%",
                            textAlign: "Begin"
                        }).addStyleClass(
                            "columnLabel"
                        ),

                        template: new ObjectStatus({
                            text: "{status}",
                            state: "{statusState}"
                        })
                    }),

                    new Column({
                        width: "auto",
                        minWidth: 192,

                        label: new Text({
                            text: "Revenue",
                            width: "100%",
                            textAlign: "Begin"
                        }).addStyleClass(
                            "columnLabel"
                        ),

                        template: new ObjectNumber({
                            number: "{amount}",
                            unit: "EUR",
                            emphasized: false
                        }).addStyleClass(
                            "revenueNumber"
                        )
                    })
                ]
            });

            sourceTable.bindRows({
                path: "/rows"
            });

            /*
             * UI5X LoadingTable
             */

            const loadingTable = new LoadingTable({
                loading: true,

                skeletonRowsMode: "Fixed",
                skeletonRows: 5,
                maxSkeletonRows: 5,

                animated: true,
                dynamicSkeletonWidths: true,

                table: sourceTable
            });

            loadingTable.setModel(model);

            /*
             * Loaded data
             */

            const loadedRows = [
                {
                    name: "Mario Rossi",
                    email: "mario.rossi@example.com",

                    company: "Acme S.p.A.",
                    segment: "Enterprise",

                    status: "Active",
                    statusState: "Success",

                    amount: "125,000"
                },

                {
                    name: "Laura Bianchi",
                    email: "laura.bianchi@example.com",

                    company: "Example S.r.l.",
                    segment: "Mid-market",

                    status: "Pending",
                    statusState: "Warning",

                    amount: "87,500"
                },

                {
                    name: "Giuseppe Verdi",
                    email: "giuseppe.verdi@example.com",

                    company: "Northwind",
                    segment: "Enterprise",

                    status: "Active",
                    statusState: "Success",

                    amount: "310,000"
                },

                {
                    name: "Anna Neri",
                    email: "anna.neri@example.com",

                    company: "Contoso",
                    segment: "SMB",

                    status: "Inactive",
                    statusState: "Error",

                    amount: "42,000"
                },

                {
                    name: "Luca Gialli",
                    email: "luca.gialli@example.com",

                    company: "Fabrikam",
                    segment: "Enterprise",

                    status: "Active",
                    statusState: "Success",

                    amount: "198,000"
                }
            ];

            /*
             * Stable showcase container
             */

            const surface = new VBox({
                width: "54rem",

                items: [
                    loadingTable
                ]
            }).addStyleClass("showcaseTable");

            surface.placeAt("content");

            function setLoading(loading) {
                model.setProperty("/rows", loading ? [] : loadedRows);
                loadingTable.setLoading(loading);
            }

            setLoading(true);

            DemoToolbar.place("LoadingTable", [
                DemoToolbar.toggle(
                    "Loading",
                    loadingTable.getLoading(),
                    setLoading
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Rows mode"),
                DemoToolbar.choice(
                    ["Fixed", "Fill"],
                    loadingTable.getSkeletonRowsMode(),
                    function (key) {
                        loadingTable.setSkeletonRowsMode(key);
                    }
                ),

                DemoToolbar.label("Rows"),
                DemoToolbar.number(
                    loadingTable.getSkeletonRows(),
                    1,
                    20,
                    function (value) {
                        loadingTable.setSkeletonRows(value);
                    }
                ),

                DemoToolbar.label("Max rows"),
                DemoToolbar.number(
                    loadingTable.getMaxSkeletonRows(),
                    1,
                    20,
                    function (value) {
                        loadingTable.setMaxSkeletonRows(value);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.toggle(
                    "Dynamic widths",
                    loadingTable.getDynamicSkeletonWidths(),
                    function (pressed) {
                        loadingTable.setDynamicSkeletonWidths(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Animated",
                    loadingTable.getAnimated(),
                    function (pressed) {
                        loadingTable.setAnimated(pressed);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Width"),
                DemoToolbar.choice(
                    ["54rem", "72rem", "100%"],
                    surface.getWidth(),
                    function (key) {
                        surface.setWidth(key);
                    }
                )
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
