<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X CopyButton Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseGrid {
            width: 24rem;
        }

        .showcaseGridRow {
            width: 100%;
        }

        .showcaseGridRow + .showcaseGridRow {
            margin-top: 1.5rem;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/library",
            "ui5x/button/CopyButton",
            "ui5x/test/demo/DemoToolbar",
            "sap/m/VBox",
            "sap/m/HBox"
        ], function (
            library,
            CopyButton,
            DemoToolbar,
            VBox,
            HBox
        ) {
            "use strict";

            /*
             * The toolbar drives both buttons, so their shared configuration
             * is the single source of truth for its initial values. Only the
             * text / icon-only distinction is fixed, because successText is
             * ignored on an icon-only button.
             */
            const sharedSettings = {
                value: "npm i @raffaeledisomma/ui5x",
                type: "Default",
                successText: "Copied",
                successIcon: "sap-icon://accept",
                successType: "Accept",
                iconFirst: true
            };

            const textButton = new CopyButton({
                ...sharedSettings,
                text: "Copy",
                width: "9rem"
            });

            const iconOnlyButton = new CopyButton({
                ...sharedSettings,
                tooltip: "Copy value"
            });

            const buttons = [
                textButton,
                iconOnlyButton
            ];

            const reference = textButton;

            new VBox({
                items: [
                    new HBox({
                        width: "100%",
                        justifyContent: "Center",
                        alignItems: "Center",
                        gap: "1.5rem",
                        items: buttons
                    }).addStyleClass("showcaseGridRow")
                ]
            })
                .addStyleClass("showcaseGrid")
                .placeAt("content");

            DemoToolbar.place("CopyButton", [
                DemoToolbar.label("Button type"),
                DemoToolbar.choice(
                    ["Default", "Emphasized", "Transparent"],
                    reference.getType(),
                    function (key) {
                        buttons.forEach(function (button) {
                            button.setType(key);
                        });
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Success type"),
                DemoToolbar.choice(
                    ["Default", "Accept", "Emphasized"],
                    reference.getSuccessType(),
                    function (key) {
                        buttons.forEach(function (button) {
                            button.setSuccessType(key);
                        });
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.toggle(
                    "Success text",
                    Boolean(reference.getSuccessText()),
                    function (pressed) {
                        buttons.forEach(function (button) {
                            button.setSuccessText(pressed ? "Copied" : "");
                        });
                    }
                ),

                DemoToolbar.toggle(
                    "Success icon",
                    Boolean(reference.getSuccessIcon()),
                    function (pressed) {
                        buttons.forEach(function (button) {
                            button.setSuccessIcon(
                                pressed ? "sap-icon://accept" : ""
                            );
                        });
                    }
                ),

                DemoToolbar.toggle(
                    "Icon first",
                    reference.getIconFirst(),
                    function (pressed) {
                        buttons.forEach(function (button) {
                            button.setIconFirst(pressed);
                        });
                    }
                ),

                DemoToolbar.separator(),

                /*
                 * The presses run inside this click handler, so they keep the
                 * user activation the Clipboard API requires and every variant
                 * shows its success feedback at the same time.
                 */
                DemoToolbar.action("Press all", function () {
                    buttons.forEach(function (button) {
                        button.firePress();
                    });
                })
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
