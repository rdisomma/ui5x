<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X Accordion Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseSurface {
            width: 35rem;
            min-height: 18rem;

            box-sizing: border-box;
        }

        .showcaseAccordion {
            width: 100%;
        }

        .showcaseSectionContent {
            min-height: 4.5rem;
            box-sizing: border-box;
        }

        .showcaseRow {
            width: 100%;
        }

        .showcaseLabel {
            font-size: 0.75rem;
            color: var(--sapContent_LabelColor);
        }

        .showcaseValue {
            margin-top: 0.125rem;

            color: var(--sapTextColor);
            font-weight: 500;
        }

        .showcaseDescription {
            margin-top: 0.5rem;

            font-size: 0.8125rem;
            line-height: 1.4;

            color: var(--sapContent_LabelColor);
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/library",
            "ui5x/layout/Accordion",
            "ui5x/layout/AccordionItem",
            "ui5x/test/demo/DemoToolbar",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Text",
            "sap/m/ObjectStatus"
        ], function (
            library,
            Accordion,
            AccordionItem,
            DemoToolbar,
            VBox,
            HBox,
            Text,
            ObjectStatus
        ) {
            "use strict";

            const generalItem = new AccordionItem({
                title: "General information",
                expanded: true,

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Organization"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "Acme S.p.A."
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Active",
                                        state: "Success"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Primary workspace used for customer and account management."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const appearanceItem = new AccordionItem({
                title: "Appearance",

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Theme"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "SAP Horizon"
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Default",
                                        state: "Information"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Uses the active UI5 theme and adapts automatically to supported variants."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const notificationsItem = new AccordionItem({
                title: "Notifications",

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Activity updates"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "Important changes only"
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Enabled",
                                        state: "Success"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Receive notifications when relevant workspace activity requires attention."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const accordion = new Accordion({
                multipleExpansion: false,

                items: [
                    generalItem,
                    appearanceItem,
                    notificationsItem
                ]
            }).addStyleClass("showcaseAccordion");

            const surface = new VBox({
                width: "35rem",

                items: [
                    accordion
                ]
            }).addStyleClass("showcaseSurface");

            surface.placeAt("content");

            const items = [
                generalItem,
                appearanceItem,
                notificationsItem
            ];

            function expandAll(expanded) {
                items.forEach(function (item) {
                    if (item.getToggleable()) {
                        item.setExpanded(expanded);
                    }
                });
            }

            DemoToolbar.place("Accordion", [
                DemoToolbar.toggle(
                    "Multiple expansion",
                    accordion.getMultipleExpansion(),
                    function (pressed) {
                        accordion.setMultipleExpansion(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Enabled",
                    items.every(function (item) {
                        return item.getEnabled();
                    }),
                    function (pressed) {
                        items.forEach(function (item) {
                            item.setEnabled(pressed);
                        });
                    }
                ),

                DemoToolbar.toggle(
                    "First section pinned",
                    !generalItem.getToggleable(),
                    function (pressed) {
                        if (pressed) {
                            generalItem.setExpanded(true);
                        }

                        generalItem.setToggleable(!pressed);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.action("Expand all", function () {
                    accordion.setMultipleExpansion(true);
                    expandAll(true);
                }),

                DemoToolbar.action("Collapse all", function () {
                    expandAll(false);
                }),

                DemoToolbar.separator(),

                DemoToolbar.label("Width"),
                DemoToolbar.choice(
                    ["35rem", "48rem", "100%"],
                    surface.getWidth(),
                    function (key) {
                        surface.setWidth(key);
                    }
                )
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
