<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X Accordion Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: var(--sapBackgroundColor);
        }

        #content {
            width: 720px;
            height: 405px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
        }

        .showcaseSurface {
            width: 35rem;
            min-height: 18rem;

            box-sizing: border-box;
        }

        .showcaseAccordion {
            width: 100%;
        }

        .showcaseSectionContent {
            min-height: 4.5rem;
            box-sizing: border-box;
        }

        .showcaseRow {
            width: 100%;
        }

        .showcaseLabel {
            font-size: 0.75rem;
            color: var(--sapContent_LabelColor);
        }

        .showcaseValue {
            margin-top: 0.125rem;

            color: var(--sapTextColor);
            font-weight: 500;
        }

        .showcaseDescription {
            margin-top: 0.5rem;

            font-size: 0.8125rem;
            line-height: 1.4;

            color: var(--sapContent_LabelColor);
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.require([
            "ui5x/library",
            "ui5x/layout/Accordion",
            "ui5x/layout/AccordionItem",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Text",
            "sap/m/ObjectStatus"
        ], function (
            library,
            Accordion,
            AccordionItem,
            VBox,
            HBox,
            Text,
            ObjectStatus
        ) {
            "use strict";

            const generalItem = new AccordionItem({
                title: "General information",
                expanded: true,

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Organization"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "Acme S.p.A."
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Active",
                                        state: "Success"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Primary workspace used for customer and account management."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const appearanceItem = new AccordionItem({
                title: "Appearance",

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Theme"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "SAP Horizon"
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Default",
                                        state: "Information"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Uses the active UI5 theme and adapts automatically to supported variants."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const notificationsItem = new AccordionItem({
                title: "Notifications",

                content: [
                    new VBox({
                        width: "100%",

                        items: [
                            new HBox({
                                width: "100%",
                                justifyContent: "SpaceBetween",
                                alignItems: "Center",

                                items: [
                                    new VBox({
                                        items: [
                                            new Text({
                                                text: "Activity updates"
                                            }).addStyleClass("showcaseLabel"),

                                            new Text({
                                                text: "Important changes only"
                                            }).addStyleClass("showcaseValue")
                                        ]
                                    }),

                                    new ObjectStatus({
                                        text: "Enabled",
                                        state: "Success"
                                    })
                                ]
                            }).addStyleClass("showcaseRow"),

                            new Text({
                                text: "Receive notifications when relevant workspace activity requires attention."
                            }).addStyleClass("showcaseDescription")
                        ]
                    }).addStyleClass("showcaseSectionContent")
                ]
            });

            const accordion = new Accordion({
                multipleExpansion: false,

                items: [
                    generalItem,
                    appearanceItem,
                    notificationsItem
                ]
            }).addStyleClass("showcaseAccordion");

            new VBox({
                width: "35rem",

                items: [
                    accordion
                ]
            })
                .addStyleClass("showcaseSurface")
                .placeAt("content");

            function showItem(item) {
                generalItem.setExpanded(
                    item === generalItem
                );

                appearanceItem.setExpanded(
                    item === appearanceItem
                );

                notificationsItem.setExpanded(
                    item === notificationsItem
                );
            }

            function play() {
                showItem(generalItem);

                setTimeout(function () {
                    showItem(appearanceItem);
                }, 1800);

                setTimeout(function () {
                    showItem(notificationsItem);
                }, 3600);

                setTimeout(function () {
                    showItem(generalItem);
                }, 5400);

                setTimeout(play, 7200);
            }

            play();
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>

</html>
