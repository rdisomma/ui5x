<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>UI5X</title>

    <meta name="description" content="An OpenUI5 and SAPUI5 library of composite controls, with theming, accessibility and state handling built in.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="UI5X">
    <meta property="og:description" content="An OpenUI5 and SAPUI5 library of composite controls, with theming, accessibility and state handling built in.">
    <meta property="og:url" content="https://rdisomma.github.io/ui5x/">
    <meta property="og:image" content="https://rdisomma.github.io/ui5x/social-preview.png">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="640">
    <meta name="twitter:card" content="summary_large_image">

    <style>
        html, body { height: 100%; margin: 0; }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge"
        data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
        data-sap-ui-resource-roots='{"ui5x.test": "/test-resources/ui5x"}'>
    </script>
</head>

<body class="sapUiBody">
    <div
        data-sap-ui-component
        data-name="ui5x.test.app"
        data-id="container"
        data-height="100%"
        data-settings='{"id": "ui5x"}'>
    </div>
</body>

</html>
