<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X ChatFeed Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: var(--sapBackgroundColor);
        }

        #content {
            width: 720px;
            height: 405px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
            padding: 1.5rem;
        }

        .showcaseChat {
            width: 100%;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.require([
            "ui5x/chat/ChatFeed",
            "ui5x/chat/ChatFeedComposerPosition",
            "ui5x/chat/ChatFeedMessageAlignment",
            "ui5x/chat/ChatMessage",
            "ui5x/chat/ChatMessageAppearance",
            "sap/ui/model/json/JSONModel"
        ], function (
            ChatFeed,
            ChatFeedComposerPosition,
            ChatFeedMessageAlignment,
            ChatMessage,
            ChatMessageAppearance,
            JSONModel
        ) {
            "use strict";

            const initialMessages = [
                {
                    id: "1",
                    text: "Hi! Could you check the latest order status?",
                    sender: "Anna",
                    ownMessage: false,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-26T16:42:00"
                },
                {
                    id: "2",
                    text: "Of course. I'm checking it now.",
                    sender: "You",
                    ownMessage: true,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-26T16:45:00"
                }
            ];

            function createInitialMessages() {
                return initialMessages.map(function (message) {
                    return { ...message };
                });
            }

            const model = new JSONModel({
                draft: "",
                messages: createInitialMessages()
            });

            const messageTemplate = new ChatMessage({
                key: "{id}",
                text: "{text}",
                sender: "{sender}",
                ownMessage: "{ownMessage}",
                editable: "{editable}",
                deletable: "{deletable}",
                timestamp: "{timestamp}"
            });

            const feed = new ChatFeed({
                value: "{/draft}",
                placeholder: "Write a message",
                loading: true,
                sendOnEnter: true,
                sendButtonText: "",
                sendButtonIcon: "sap-icon://paper-plane",
                sendButtonType: "Emphasized",
                showSendButton: true,
                sendButtonEnabled: true,
                groupByDate: true,
                highlightOwnMessage: false,
                ownMessageAppearance: ChatMessageAppearance.Bubble,
                incomingMessageAppearance: ChatMessageAppearance.Conversation,
                composerPosition: ChatFeedComposerPosition.Bottom,
                messageAlignment: ChatFeedMessageAlignment.Bottom,
                chatMaxHeight: "22rem",
                enabled: true,

                send: function (event) {
                    const messages = model.getProperty("/messages");

                    messages.push({
                        id: "4",
                        text: event.getParameter("value"),
                        sender: "You",
                        ownMessage: true,
                        editable: true,
                        deletable: true,
                        timestamp: "2026-08-27T10:18:00"
                    });

                    model.refresh(true);
                },

                messageEdit: function (event) {
                    const message = event.getParameter("message");
                    const context = message.getBindingContext();

                    if (context) {
                        const path = `${context.getPath()}/text`;

                        model.setProperty(path, event.getParameter("value"));
                    }
                },

                messageDelete: function (event) {
                    const message = event.getParameter("message");
                    const context = message.getBindingContext();

                    if (context) {
                        const index = Number(context.getPath().split("/").pop());
                        const messages = model.getProperty("/messages");

                        messages.splice(index, 1);
                        model.refresh(true);
                    }
                }
            });

            feed.setModel(model);
            feed.bindAggregation("messages", {
                path: "/messages",
                template: messageTemplate,
                templateShareable: false
            });
            feed
                .addStyleClass("showcaseChat")
                .placeAt("content");

            function wait(milliseconds) {
                return new Promise(function (resolve) {
                    window.setTimeout(resolve, milliseconds);
                });
            }

            async function typeMessage(text) {
                feed._getTextArea().focus();

                for (let index = 1; index <= text.length; index += 1) {
                    feed.setValue(text.slice(0, index));
                    await wait(35);
                }
            }

            function resetConversation() {
                feed.setLoading(true);
                feed.setValue("");
                model.setProperty("/messages", createInitialMessages());
            }

            function addStatusUpdate() {
                const messages = model.getProperty("/messages");

                messages.push({
                    id: "3",
                    text: "It was shipped this morning.",
                    sender: "Anna",
                    ownMessage: false,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-27T09:10:00"
                });

                model.refresh(true);
            }

            function addIncomingReply() {
                const messages = model.getProperty("/messages");

                messages.push({
                    id: "5",
                    text: "Sure! I've sent the tracking link and delivery details.",
                    sender: "Anna",
                    ownMessage: false,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-27T10:19:00"
                });

                model.refresh(true);
            }

            async function play() {
                resetConversation();

                await wait(1100);
                feed.setLoading(false);

                await wait(600);
                addStatusUpdate();

                await wait(700);
                await typeMessage(
                    "Great! Could you send me the tracking link and confirm the delivery date?"
                );

                await wait(300);
                feed._getSendButton().firePress();

                await wait(900);
                addIncomingReply();

                await wait(2200);
                play();
            }

            play();
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="content"></div>
</body>

</html>
