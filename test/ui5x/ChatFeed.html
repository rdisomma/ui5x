<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X ChatFeed Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            flex-direction: column;

            background: var(--sapBackgroundColor);
        }

        #toolbar {
            flex: 0 0 auto;
        }

        #content {
            flex: 1 1 auto;
            overflow: auto;

            display: flex;
            align-items: flex-start;
            justify-content: center;

            padding: 1.5rem;
            box-sizing: border-box;
        }

        .showcaseChat {
            width: 100%;
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.loader.config({
            paths: {
                "ui5x/test": "/test-resources/ui5x"
            }
        });

        sap.ui.require([
            "ui5x/chat/ChatFeed",
            "ui5x/chat/ChatFeedComposerPosition",
            "ui5x/chat/ChatFeedMessageAlignment",
            "ui5x/chat/ChatMessage",
            "ui5x/chat/ChatMessageAppearance",
            "ui5x/test/demo/DemoToolbar",
            "sap/ui/model/json/JSONModel"
        ], function (
            ChatFeed,
            ChatFeedComposerPosition,
            ChatFeedMessageAlignment,
            ChatMessage,
            ChatMessageAppearance,
            DemoToolbar,
            JSONModel
        ) {
            "use strict";

            const initialMessages = [
                {
                    id: "1",
                    text: "Hi! Could you check the latest order status?",
                    sender: "Anna",
                    ownMessage: false,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-26T16:42:00"
                },
                {
                    id: "2",
                    text: "Of course. I'm checking it now.",
                    sender: "You",
                    ownMessage: true,
                    editable: false,
                    deletable: false,
                    timestamp: "2026-08-26T16:45:00"
                }
            ];

            let messageId = initialMessages.length;

            function nextId() {
                messageId += 1;

                return String(messageId);
            }

            function createInitialMessages() {
                return initialMessages.map(function (message) {
                    return { ...message };
                });
            }

            const model = new JSONModel({
                draft: "",
                messages: createInitialMessages()
            });

            const messageTemplate = new ChatMessage({
                key: "{id}",
                text: "{text}",
                sender: "{sender}",
                ownMessage: "{ownMessage}",
                editable: "{editable}",
                deletable: "{deletable}",
                timestamp: "{timestamp}"
            });

            const feed = new ChatFeed({
                value: "{/draft}",
                placeholder: "Write a message",
                loading: false,
                sendOnEnter: true,
                sendButtonText: "",
                sendButtonIcon: "sap-icon://paper-plane",
                sendButtonType: "Emphasized",
                showSendButton: true,
                sendButtonEnabled: true,
                groupByDate: true,
                highlightOwnMessage: false,
                ownMessageAppearance: ChatMessageAppearance.Bubble,
                incomingMessageAppearance: ChatMessageAppearance.Conversation,
                composerPosition: ChatFeedComposerPosition.Bottom,
                messageAlignment: ChatFeedMessageAlignment.Bottom,
                chatMaxHeight: "22rem",
                enabled: true,

                send: function (event) {
                    const messages = model.getProperty("/messages");

                    messages.push({
                        id: nextId(),
                        text: event.getParameter("value"),
                        sender: "You",
                        ownMessage: true,
                        editable: true,
                        deletable: true,
                        timestamp: "2026-08-27T10:18:00"
                    });

                    model.refresh(true);
                },

                messageEdit: function (event) {
                    const message = event.getParameter("message");
                    const context = message.getBindingContext();

                    if (context) {
                        const path = `${context.getPath()}/text`;

                        model.setProperty(path, event.getParameter("value"));
                    }
                },

                messageDelete: function (event) {
                    const message = event.getParameter("message");
                    const context = message.getBindingContext();

                    if (context) {
                        const index = Number(context.getPath().split("/").pop());
                        const messages = model.getProperty("/messages");

                        messages.splice(index, 1);
                        model.refresh(true);
                    }
                }
            });

            feed.setModel(model);
            feed.bindAggregation("messages", {
                path: "/messages",
                template: messageTemplate,
                templateShareable: false
            });
            feed
                .addStyleClass("showcaseChat")
                .placeAt("content");

            DemoToolbar.place("ChatFeed", [
                DemoToolbar.toggle(
                    "Loading",
                    feed.getLoading(),
                    function (pressed) {
                        feed.setLoading(pressed);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Composer"),
                DemoToolbar.choice(
                    ["Top", "Bottom"],
                    feed.getComposerPosition(),
                    function (key) {
                        feed.setComposerPosition(key);
                    }
                ),

                DemoToolbar.label("Alignment"),
                DemoToolbar.choice(
                    ["Top", "Bottom"],
                    feed.getMessageAlignment(),
                    function (key) {
                        feed.setMessageAlignment(key);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Own messages"),
                DemoToolbar.choice(
                    ["Bubble", "Conversation"],
                    feed.getOwnMessageAppearance(),
                    function (key) {
                        feed.setOwnMessageAppearance(key);
                    }
                ),

                DemoToolbar.label("Incoming"),
                DemoToolbar.choice(
                    ["Bubble", "Conversation"],
                    feed.getIncomingMessageAppearance(),
                    function (key) {
                        feed.setIncomingMessageAppearance(key);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Timestamp"),
                DemoToolbar.choice(
                    ["None", "Time", "DateTime"],
                    feed.getMessageTimestampFormat(),
                    function (key) {
                        feed.setMessageTimestampFormat(key);
                    }
                ),

                DemoToolbar.toggle(
                    "Group by date",
                    feed.getGroupByDate(),
                    function (pressed) {
                        feed.setGroupByDate(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Highlight own",
                    feed.getHighlightOwnMessage(),
                    function (pressed) {
                        feed.setHighlightOwnMessage(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Send button",
                    feed.getShowSendButton(),
                    function (pressed) {
                        feed.setShowSendButton(pressed);
                    }
                ),

                DemoToolbar.toggle(
                    "Enabled",
                    feed.getEnabled(),
                    function (pressed) {
                        feed.setEnabled(pressed);
                    }
                ),

                DemoToolbar.separator(),

                DemoToolbar.label("Height"),
                DemoToolbar.choice(
                    ["22rem", "32rem", "100%"],
                    feed.getChatMaxHeight(),
                    function (key) {
                        feed.setChatMaxHeight(key);
                    }
                ),

                /*
                 * An incoming message recreates the bound ChatMessage
                 * controls, so it also shows that an open editor keeps its
                 * unconfirmed draft.
                 */
                DemoToolbar.action("Incoming message", function () {
                    const messages = model.getProperty("/messages");

                    messages.push({
                        id: nextId(),
                        text: "Sure! I've sent the tracking link.",
                        sender: "Anna",
                        ownMessage: false,
                        editable: false,
                        deletable: false,
                        timestamp: "2026-08-27T10:19:00"
                    });

                    model.refresh(true);
                }),

                DemoToolbar.action("Reset", function () {
                    feed.setValue("");
                    model.setProperty("/messages", createInitialMessages());
                })
            ]);
        });
    </script>
</head>

<body class="sapUiBody sapUiSizeCompact">
    <div id="toolbar"></div>
    <div id="content"></div>
</body>

</html>
