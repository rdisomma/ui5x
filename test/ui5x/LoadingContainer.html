<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">

    <title>UI5X LoadingContainer Demo</title>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body.sapUiBody {
            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            background: var(--sapBackgroundColor);
        }

        #content {
            width: 640px;
            height: 360px;

            display: flex;
            align-items: center;
            justify-content: center;

            box-sizing: border-box;
        }

        .showcasePanel {
            width: 26rem;
            box-sizing: border-box;

            padding: 1.25rem;

            background: var(--sapGroup_ContentBackground);
            border: 1px solid var(--sapGroup_ContentBorderColor);
            border-radius: 0.5rem;
        }

        .showcaseState {
            width: 100%;
            height: 11.25rem;
            box-sizing: border-box;
        }

        .showcaseHeaderContent {
            min-width: 0;
        }

        .showcaseLabel {
            margin-bottom: 0.125rem;

            font-size: 0.75rem;
            color: var(--sapContent_LabelColor);
        }

        .showcaseTitle {
            color: var(--sapGroup_TitleTextColor);
        }

        .showcaseSubtitle {
            margin-top: 0.125rem;

            font-size: 0.875rem;
            color: var(--sapContent_LabelColor);
        }

        .showcaseDescription {
            line-height: 1.45;
            color: var(--sapTextColor);
        }
    </style>

    <script
        id="sap-ui-bootstrap"
        src="/resources/sap-ui-core.js"
        data-sap-ui-theme="sap_horizon"
        data-sap-ui-async="true"
        data-sap-ui-compat-version="edge">
    </script>

    <script>
        sap.ui.require([
            "ui5x/library",
            "ui5x/loading/Skeleton",
            "ui5x/loading/LoadingContainer",
            "sap/m/VBox",
            "sap/m/HBox",
            "sap/m/Text",
            "sap/m/Title",
            "sap/m/Avatar",
            "sap/m/ObjectStatus",
            "sap/m/MessageStrip",
            "sap/m/FlexItemData"
        ], function (
            library,
            Skeleton,
            LoadingContainer,
            VBox,
            HBox,
            Text,
            Title,
            Avatar,
            ObjectStatus,
            MessageStrip,
            FlexItemData
        ) {

            /*
             * Loading state
             *
             * Circle    -> Avatar
             * Line      -> Text content / status
             * Rectangle -> MessageStrip
             */

            const placeholder = new VBox({
                width: "100%",
                height: "11.25rem",
                justifyContent: "SpaceBetween",
                items: [
                    new HBox({
                        width: "100%",
                        alignItems: "Center",
                        gap: "1rem",
                        items: [
                            new Skeleton({
                                type: "Circle",
                                width: "3rem"
                            }),

                            new VBox({
                                gap: "0.5rem",
                                items: [
                                    new Skeleton({
                                        type: "Line",
                                        width: "10rem"
                                    }),

                                    new Skeleton({
                                        type: "Line",
                                        width: "14rem"
                                    })
                                ],
                                layoutData: new FlexItemData({
                                    growFactor: 1,
                                    baseSize: "0"
                                })
                            }),

                            new Skeleton({
                                type: "Line",
                                width: "3.5rem"
                            })
                        ]
                    }),

                    new Skeleton({
                        type: "Line",
                        lines: 3,
                        width: "100%"
                    }),

                    new Skeleton({
                        type: "Rectangle",
                        width: "100%"
                    })
                ]
            }).addStyleClass("showcaseState");


            /*
             * Loaded state
             */

            const content = new VBox({
                width: "100%",
                height: "11.25rem",
                justifyContent: "SpaceBetween",
                items: [
                    new HBox({
                        width: "100%",
                        alignItems: "Center",
                        gap: "1rem",
                        items: [
                            new Avatar({
                                initials: "UX",
                                displaySize: "S",
                                backgroundColor: "Accent6"
                            }),

                            new VBox({
                                items: [
                                    new Text({
                                        text: "Project overview"
                                    }).addStyleClass("showcaseLabel"),

                                    new Title({
                                        text: "UI5X Component Library",
                                        level: "H4"
                                    }).addStyleClass("showcaseTitle"),

                                    new Text({
                                        text: "Modern UX extensions for UI5",
                                        wrapping: false
                                    }).addStyleClass("showcaseSubtitle")
                                ],
                                layoutData: new FlexItemData({
                                    growFactor: 1,
                                    baseSize: "0"
                                })
                            }).addStyleClass("showcaseHeaderContent"),

                            new ObjectStatus({
                                text: "Ready",
                                state: "Success",
                                inverted: true
                            })
                        ]
                    }),

                    new Text({
                        text:
                            "Build expressive loading experiences while keeping " +
                            "application content clean and declarative.",
                        wrapping: true
                    }).addStyleClass("showcaseDescription"),

                    new MessageStrip({
                        text: "Content loaded successfully.",
                        type: "Information",
                        showIcon: true,
                        showCloseButton: false
                    })
                ]
            }).addStyleClass("showcaseState");


            /*
             * LoadingContainer
             */

            const loadingContainer = new LoadingContainer({
                loading: true,
                placeholder: placeholder,
                content: content
            });


            /*
             * Stable showcase surface
             */

            new VBox({
                width: "26rem",
                items: [
                    loadingContainer
                ]
            })
                .addStyleClass("showcasePanel")
                .placeAt("content");


            /*
             * Automatic loop for recording
             */

            function play() {
                loadingContainer.setLoading(true);

                setTimeout(function () {
                    loadingContainer.setLoading(false);
                }, 1800);

                setTimeout(play, 4200);
            }

            play();
        });
    </script>
</head>

<body class="sapUiBody">
    <div id="content"></div>
</body>

</html>
